name: build

on:
  push:
    branches: [main, develop, 'lane/**', 'feature/**', 'release/**']
  pull_request:
  workflow_dispatch:

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0        # git describe needs the tags

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build pkg-config python3 \
            glslc libvulkan-dev \
            libavcodec-dev libavformat-dev libswscale-dev libavutil-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libopus-dev libpulse-dev libpipewire-0.3-dev libsdl2-dev libdrm-dev libpng-dev \
            libwayland-dev libx11-dev libxcb1-dev libxxf86vm-dev libxrandr-dev \
            libgl-dev libegl-dev libwayland-bin wayland-protocols \
            mesa-vulkan-drivers

      # LiteRT is built outside the tree by depth/tools/build-litert.sh
      # (about 12 minutes); keep the result between runs. The key changes
      # when the script does.
      - name: Cache LiteRT
        id: litert
        uses: actions/cache@v4
        with:
          path: ~/Games/MoonlightXRNative/third-party-build/litert/dist
          key: litert-${{ runner.arch }}-${{ hashFiles('depth/tools/build-litert.sh') }}

      - name: Build LiteRT
        if: steps.litert.outputs.cache-hit != 'true'
        run: JOBS=4 ./depth/tools/build-litert.sh

      - name: Build
        run: JOBS=4 ./build.sh
        env:
          SKIP_AUDIT: '1'       # the ldd audit compares against SteamOS packages
          NO_LAUNCHER: '1'      # the flat launcher needs Qt 6.5 or newer (Ubuntu 24.04 has 6.4); built on the Frame

      # Left out of CI:
      #   audio_pulse      needs a PulseAudio server
      #   video_*          need /dev/video-dec0 (Qualcomm Iris) and the generated sample clips
      # The Vulkan tests (shaders_*, rooms_*, m5_world_*, m6_*) run on lavapipe,
      # Mesa's CPU Vulkan driver (mesa-vulkan-drivers, picked by VK_ICD_FILENAMES);
      # MLXR_SOFT_GPU=1 makes their time budgets print instead of fail, since a
      # CPU rasteriser's times say nothing of the Frame's GPU. They still skip
      # themselves (exit 77) where there is no Vulkan driver or device at all.
      # Everything else runs on the CPU: backend (fake Sunshine host on localhost),
      # xrcore, ui, depth (LiteRT, CPU), the other audio tests, stream_evkbd.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j2 -E '^(audio_pulse|video_)'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          MLXR_SOFT_GPU: '1'

      # The pictures the tests drew (ui snapshots, rooms, the world snapshot),
      # for a reviewer to look at; also the shrunk ui snapshots
      # (golden-actual/) that m4_snapshot_golden compares with tests/ui/golden
      - name: Upload test pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-pictures
          path: build/**/*.png
          if-no-files-found: ignore

  # The release candidate: the full tarball (VR client and flat launcher), built the way a release is
  # built and uploaded as an artifact; releases publish this artifact (tools/release.sh). Ubuntu 24.04 has
  # glibc 2.39, the older SteamOS's (docs/probe/host-sonames/), and the newer SteamOS (glibc 2.43) runs
  # what is built against it. The app carries what SteamOS updates move or drop: FFmpeg 7.0.2, libxml2
  # 2.13.9 and SDL2_ttf 2.24.0 (tools/build-bundled-libs.sh) and the launcher's own Qt 6.8 (the launcher
  # job, tools/stage-launcher.sh), all in app/ and found through RUNPATH $ORIGIN/lib and qt.conf.
  # tools/check-bundle.sh (run by release.sh) fails when anything else would come from the system
  # (tools/host-libs.allow) or a binary needs a newer glibc. Tests run in the linux-arm64 and launcher
  # jobs; tools/ldd-audit.sh needs pacman.
  frame-artifact:
    needs: launcher
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0        # git describe needs the tags

      # the runtime libraries too: release.sh starts the unpacked launcher (offscreen), and its plugins'
      # host libraries (xcb, xkbcommon, fontconfig) should resolve for tools/check-bundle.sh
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build pkg-config python3 \
            glslc libvulkan-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libopus-dev libpulse-dev libpipewire-0.3-dev libsdl2-dev libdrm-dev libpng-dev \
            libwayland-dev libx11-dev libxcb1-dev libxxf86vm-dev libxrandr-dev \
            libgl-dev libegl-dev libwayland-bin wayland-protocols \
            libva-dev libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-shm0 \
            libwayland-cursor0 libwayland-egl1 libgssapi-krb5-2

      # The key is the script's hash: it holds the versions, checksums and configure flags.
      - name: Cache the bundled libraries
        id: bundled
        uses: actions/cache@v4
        with:
          path: ~/Games/MoonlightXRNative/third-party-build/bundled/dist
          key: bundled-${{ runner.arch }}-${{ hashFiles('tools/build-bundled-libs.sh') }}

      - name: Build the bundled libraries (FFmpeg 7.0.2, libxml2 2.13.9, SDL2_ttf 2.24.0)
        run: JOBS=4 ./tools/build-bundled-libs.sh

      # Same cache as the linux-arm64 job.
      - name: Cache LiteRT
        id: litert
        uses: actions/cache@v4
        with:
          path: ~/Games/MoonlightXRNative/third-party-build/litert/dist
          key: litert-${{ runner.arch }}-${{ hashFiles('depth/tools/build-litert.sh') }}

      - name: Build LiteRT
        if: steps.litert.outputs.cache-hit != 'true'
        run: JOBS=4 ./depth/tools/build-litert.sh

      - name: Build
        run: JOBS=4 ./build.sh
        env:
          SKIP_AUDIT: '1'       # the ldd audit compares against SteamOS packages
          NO_LAUNCHER: '1'      # the flat launcher comes from the launcher job
      - name: Check the libraries the binaries need
        run: |
          B="$HOME/Games/MoonlightXRNative/third-party-build/bundled/dist/lib"
          for b in build/moonlight-xr build/backend/mlxr-cli build/input/mlxr-gamepad-probe; do
            echo "== $b NEEDED"
            objdump -p "$b" | awk '$1 == "NEEDED" { print "  " $2 }'
            rp="$(readelf -d "$b" | sed -n 's/.*(RUNPATH).*\[\(.*\)\]/\1/p')"
            [ "$rp" = '$ORIGIN/lib' ] || { echo "::error::$b has RUNPATH '$rp', not \$ORIGIN/lib"; exit 1; }
            ! readelf -d "$b" | grep -q '(RPATH)' || { echo "::error::$b has an RPATH"; exit 1; }
          done
          needed="$(objdump -p build/moonlight-xr | awk '$1 == "NEEDED" { print $2 }')"
          av="$(grep -E '^lib(av|sw)' <<<"$needed" | sort | tr '\n' ' ')"
          [ "$av" = "libavcodec.so.61 libavformat.so.61 libavutil.so.59 libswscale.so.8 " ] \
            || { echo "::error::FFmpeg libraries are not the bundled FFmpeg 7.0's: $av"; exit 1; }
          objdump -p build/backend/mlxr-cli | awk '$1 == "NEEDED" { print $2 }' | grep -qx libxml2.so.2 \
            || { echo "::error::mlxr-cli does not need libxml2.so.2"; exit 1; }
          # SteamOS has glibc 2.39
          glibc="$(objdump -T build/moonlight-xr build/backend/mlxr-cli "$B"/lib*.so.* | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"
          echo "newest glibc symbol version: $glibc"
          [ "$(printf '%s\nGLIBC_2.39\n' "$glibc" | sort -V | tail -n 1)" = GLIBC_2.39 ] \
            || { echo "::error::needs $glibc, SteamOS has 2.39"; exit 1; }
          echo "== build/moonlight-xr resolved here (bundled libraries through build/lib)"
          env -u LD_LIBRARY_PATH ldd build/moonlight-xr | tee "$RUNNER_TEMP/ldd.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/ldd.txt" || { echo "::error::unresolved libraries"; exit 1; }

      - name: The launcher staged by the launcher job
        uses: actions/download-artifact@v4
        with:
          name: launcher-stage
          path: ${{ runner.temp }}/launcher-stage

      # the full release: release.sh checks the app (tools/check-bundle.sh), packs it, then unpacks it,
      # installs it twice into a temporary folder and starts the client and the launcher from there
      - name: Release tarball
        run: |
          mkdir -p build-launcher/stage dist
          tar -xzf "$RUNNER_TEMP/launcher-stage/launcher-stage.tar.gz" -C build-launcher/stage
          OUT=dist ALLOW_MISSING_HOST=1 ./tools/release.sh
          ls -l dist
          echo "VERSION=$(head -n 1 VERSION)" >> "$GITHUB_ENV"

      # The reported failure: the system has no libavcodec.so.61 (this runner has no FFmpeg at all) and its
      # own libxml2 is not the one we ship. Unpacked, the client must load every bundled library from its
      # app/lib and reach main() (a usage error comes back before any XR).
      - name: The unpacked client starts on its bundled libraries
        run: |
          t="$RUNNER_TEMP/unpacked"; rm -rf "$t"; mkdir -p "$t"
          tar -xzf dist/*.tar.gz -C "$t"
          A="$t/MoonlightXRNative/app"; L="$(readlink -f "$A/lib")"
          ls -l "$A/lib"
          ! ls /usr/lib/*/libavcodec.so.61 2>/dev/null || { echo "::error::this runner has a system libavcodec.so.61; the check proves nothing"; exit 1; }
          for b in moonlight-xr mlxr-cli mlxr-gamepad-probe; do
            env -u LD_LIBRARY_PATH ldd "$A/$b" > "$RUNNER_TEMP/ldd-$b.txt"
            ! grep -q 'not found' "$RUNNER_TEMP/ldd-$b.txt" || { cat "$RUNNER_TEMP/ldd-$b.txt"; echo "::error::$b: unresolved"; exit 1; }
            for n in $(ls "$A/lib"); do
              grep -q "^[[:space:]]*$n => " "$RUNNER_TEMP/ldd-$b.txt" || continue
              grep -qF "$n => $L/$n " "$RUNNER_TEMP/ldd-$b.txt" || { grep "$n" "$RUNNER_TEMP/ldd-$b.txt"; echo "::error::$b loads $n from outside app/lib"; exit 1; }
            done
          done
          env -u LD_LIBRARY_PATH "$A/moonlight-xr" --network bogus 2>&1 | tee "$RUNNER_TEMP/start.txt" | grep -q 'MLXR_ERROR: --network takes' \
            || { cat "$RUNNER_TEMP/start.txt"; echo "::error::the unpacked moonlight-xr does not start"; exit 1; }
          echo "the unpacked client starts on app/lib: $(ls "$A/lib" | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-xr-steam-frame-${{ env.VERSION }}-release-candidate
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  # The flat launcher (patched moonlight-qt 6.1.0, qmake), its offscreen tests (tests/launcher/run_tests.sh)
  # and the launcher with its own Qt for the release (tools/stage-launcher.sh, the launcher-stage
  # artifact the frame-artifact job packs). Qt 6.8.3, the last open-source 6.8 LTS build, from aqtinstall:
  # built on Ubuntu 24.04 for linux arm64, with qtwayland and its ICU. SteamOS's own Qt moved from 6.8.0
  # to 6.10.2 in an update, so the launcher never uses the system's Qt.
  launcher:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      QT_VERSION: '6.8.3'
      QT_ROOT: /home/runner/Qt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # no libsdl2-ttf-dev: SDL2_ttf is the bundled one (tools/build-bundled-libs.sh)
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build pkg-config python3 python3-venv \
            build-essential rsync patch patchelf \
            glslc libvulkan-dev \
            libavcodec-dev libavformat-dev libswscale-dev libavutil-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libopus-dev libsdl2-dev libva-dev libdrm-dev \
            libwayland-dev libx11-dev libxcb1-dev libxxf86vm-dev libxrandr-dev \
            libgl-dev libegl-dev libwayland-bin wayland-protocols \
            libxkbcommon-dev libfontconfig1-dev libfreetype-dev libdbus-1-dev libglib2.0-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xkb1 libxcb-shape0 libxcb-xinerama0 libwayland-cursor0 libwayland-egl1

      - name: Cache Qt
        id: qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ env.QT_VERSION }}-linux_gcc_arm64-qtshadertools-v1

      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall)
        if: steps.qt.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$HOME/aqt-venv"
          "$HOME/aqt-venv/bin/pip" install aqtinstall
          "$HOME/aqt-venv/bin/aqt" list-qt linux_arm64 desktop
          # qtbase, qtdeclarative (Qt Quick, Controls), qtsvg, qttools, qtwayland and ICU come with the
          # base archives; qtshadertools is a separate module that Qt Quick needs.
          "$HOME/aqt-venv/bin/aqt" install-qt linux_arm64 desktop "$QT_VERSION" linux_gcc_arm64 \
            -m qtshadertools --outputdir "$QT_ROOT"

      # Same cache as the frame-artifact job: the launcher links the bundled FFmpeg and SDL2_ttf.
      - name: Cache the bundled libraries
        uses: actions/cache@v4
        with:
          path: ~/Games/MoonlightXRNative/third-party-build/bundled/dist
          key: bundled-${{ runner.arch }}-${{ hashFiles('tools/build-bundled-libs.sh') }}

      - name: Build mlxr-cli, mlxr-settings-dump and the fake host
        run: NO_DEPTH=1 SKIP_AUDIT=1 JOBS=4 ./build.sh mlxr-cli mlxr-settings-dump backend_fake_host_main

      - name: Build the launcher
        run: |
          QT_BIN="$QT_ROOT/$QT_VERSION/gcc_arm64/bin"
          [ -x "$QT_BIN/qmake6" ] || ln -s qmake "$QT_BIN/qmake6"
          export PATH="$QT_BIN:$PATH"
          qmake6 --version
          SKIP_AUDIT=1 JOBS=4 ./launcher/build.sh

      # the launcher must find the bundled FFmpeg and SDL2_ttf beside itself, as in app/ (1.1.1's first CI
      # run linked a broken -rpath,$ORIGIN/RIGIN/lib and every launcher test failed on libavcodec.so.61)
      - name: The launcher loads the bundled FFmpeg and SDL2_ttf
        run: |
          B="$PWD/build-launcher/moonlight-xr-launcher"
          readelf -d "$B" | grep -E 'RPATH|RUNPATH'
          readelf -d "$B" | grep -q 'RUNPATH.*\[\$ORIGIN/lib[]:]' || { echo "$B: RUNPATH lacks \$ORIGIN/lib"; exit 1; }
          ! readelf -d "$B" | grep -q '(RPATH)' || { echo "$B: RPATH instead of RUNPATH"; exit 1; }
          env -u LD_LIBRARY_PATH ldd "$B" > ldd.txt
          ! grep 'not found' ldd.txt || exit 1
          L="$(readlink -f build-launcher/lib)"
          for n in libavcodec.so.61 libavutil.so.59 libswscale.so.8 libSDL2_ttf-2.0.so.0; do
            grep -E "^\s*$n => " ldd.txt
            grep -qE "^\s*$n => ($L|$PWD/build-launcher/lib)/$n " ldd.txt || { echo "$B loads $n from outside build-launcher/lib"; exit 1; }
          done

      # launcher_vs_stock is not run: it needs a second full moonlight-qt build
      # (tests/launcher/build-stock.sh), so it skips itself (exit 77).
      - name: Test
        run: ctest --test-dir build -R '^launcher_' --output-on-failure

      # The launcher as the release ships it: its Qt libraries, plugins and QML modules in a lib/, plugins/
      # and qml/ beside it, with qt.conf
      - name: Stage the launcher with its own Qt
        run: |
          ./tools/stage-launcher.sh "$QT_ROOT/$QT_VERSION/gcc_arm64" build-launcher/stage
          tar -czf "$RUNNER_TEMP/launcher-stage.tar.gz" -C build-launcher/stage .

      # uploaded before its tests, so a failure there still leaves the frame-artifact job its input
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-stage
          path: ${{ runner.temp }}/launcher-stage.tar.gz
          if-no-files-found: error

      # The same tests against the staged launcher, with only the bundled libraries beside it: what it
      # draws must come from the QML modules and plugins stage-launcher.sh picked. The Qt it was built
      # with is moved away first, so nothing can fall back to it.
      - name: Test the staged launcher
        run: |
          T="$RUNNER_TEMP/staged"; rm -rf "$T"; mkdir -p "$T"
          tar -xzf "$RUNNER_TEMP/launcher-stage.tar.gz" -C "$T"
          cp -L "$HOME"/Games/MoonlightXRNative/third-party-build/bundled/dist/lib/lib*.so.[0-9]* "$T/lib/"
          mv "$QT_ROOT" "$QT_ROOT.away"
          env -u LD_LIBRARY_PATH ldd "$T/moonlight-xr-launcher" | grep -E 'Qt6|icu|not found' || true
          rc=0; tests/launcher/run_tests.sh "$T/moonlight-xr-launcher" "$PWD/build/backend/mlxr-cli" "$RUNNER_TEMP/staged-shots" || rc=$?
          mv "$QT_ROOT.away" "$QT_ROOT"
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-test-output
          path: |
            build-launcher/shots/
            build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/staged-shots/
          if-no-files-found: ignore
